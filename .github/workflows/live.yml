name: Refresh live desk

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect Alpaca snapshot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          OPENAI_REMAINING_USD: ${{ secrets.OPENAI_REMAINING_USD }}
          OPENAI_TOTAL_USD: ${{ secrets.OPENAI_TOTAL_USD }}
          OPENAI_EXPIRES_AT: ${{ secrets.OPENAI_EXPIRES_AT }}
        run: python3 scripts/collect_live.py --skip-bot
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && echo "No live.json change" && exit 0
          git commit -m "Refresh live desk snapshot."
          git push
