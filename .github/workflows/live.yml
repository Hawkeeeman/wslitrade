name: Refresh live desk

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_live.py"
      - ".github/workflows/live.yml"

concurrency:
  group: live-desk-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test status and collection logic
        run: |
          node --test tests/status.test.js
          python3 -m unittest discover -s tests -v
      - name: Collect Alpaca snapshot
        id: snapshot
        continue-on-error: true
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python3 scripts/collect_live.py --skip-bot
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && echo "No live.json change" && exit 0
          git commit -m "Refresh live desk snapshot."
          git pull --rebase origin main
          git push
      - name: Report partial refresh failure
        if: steps.snapshot.outcome == 'failure'
        run: exit 1
